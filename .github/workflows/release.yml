name: Release GameKeyMaster

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Setup .NET 8
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: 8.0.x

    - name: Publish Standalone
      run: dotnet publish GameKeyMaster.csproj -c Release -r win-x64 --self-contained true -o ./publish

    - name: Create ZIP Archive
      shell: pwsh
      run: Compress-Archive -Path ./publish/* -DestinationPath ./GameKeyMaster_win-x64.zip

    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        files: GameKeyMaster_win-x64.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}